version: '3.8'

services:
# ── Tier 3: Database ──────────────────────────
  mongodb:
    image: mongo:6
    container_name: todo-monodb
    volumes:
      - mongodata:/data/db
    networks:
      - todo-net
    restart: always

# ── Tier 2: Backend ───────────────────────────
  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/tododb
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - todo-net
    restart: on-failure

# ── Tier 1: Frontend ──────────────────────────
  forntend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - todo-net
    restart: on-failure

# ── Volumes ───────────────────────────────────
volumes:
    mongodata:

# ── Networks ──────────────────────────────────

networks:
  todo-net:

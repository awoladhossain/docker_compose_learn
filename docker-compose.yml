services:
  mongodb:
    image: mongo:6
    container_name: todo-mongodb
    env_file:
      - .env
    volumes:
      - mongodata:/data/db
    networks:
      - todo-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: todo-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - MONGO_URL=${MONGO_URL}
    depends_on:
      - mongodb
    networks:
      - todo-net
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: todo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - todo-net
    restart: on-failure

volumes:
  mongodata:

networks:
  todo-net:
    driver: bridge
